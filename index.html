<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#132c4b">
  <title>奶了个蛙</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="world">
    <header class="topbar"><div class="brand">奶了个蛙<small>MILK FROG</small></div><div class="level-pill" id="levelText">关卡 01</div></header>
    <section class="mission"><div class="moon">🐸</div><div><strong>奶蛙收集挑战</strong><span>点击最上层的奶蛙，手机槽凑齐三个自动消除</span></div><div class="counter"><span id="remaining">0</span> 张</div></section>
    <section class="lake"><span class="reed r1">♧</span><span class="reed r2">♧</span><div class="board" id="board" aria-label="奶蛙牌面"></div></section>
    <div class="tray-label">奶蛙手机槽 · 三个相同自动消除</div><div class="tray" id="tray" aria-label="奶蛙手机槽"></div>
    <section class="tools" aria-label="辅助道具">
      <button class="tool" data-tool="remove"><i>↗</i><b>移出</b><em>×<span>2</span></em></button><button class="tool" data-tool="undo"><i>↶</i><b>撤销</b><em>×<span>2</span></em></button><button class="tool" data-tool="expand"><i>＋</i><b>扩容</b><em>×<span>1</span></em></button>
    </section>
    <p class="rule">仅可点选未被压住的牌。奶蛙手机槽满 <span id="limitText">7</span> 格即失败。</p>
  </main>
  <footer class="site-footer"><a href="https://game.0z.hk/" target="_blank" rel="noreferrer">更多奶蛙游戏</a></footer>
  <div class="toast" id="toast" role="status"></div>
  <div class="overlay" id="overlay"><div class="dialog"><div class="big">🐸</div><h2>奶了个蛙</h2><p>点击最上层的奶蛙放进手机槽，三个相同奶蛙会自动消除。槽满之前完成全部牌面即可过关。</p><button id="start">开始游戏</button></div></div>
  <script src="game.js"></script>
</body>
</html>
